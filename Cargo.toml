[package]
name = "sysmon"
version = "0.1.0"
edition = "2024"
description = "Live system monitor for CPU, battery, memory, network, and processes (GTK4/libadwaita)"
authors = ["Sysmon authors"]
license-file = "LICENSE"
repository = "https://github.com/example/sysmon"

[dependencies]
glib = "0.22.8"
gtk4 = { version = "0.11.4", features = ["v4_6"] }
libadwaita = { version = "0.9.2", features = ["v1_1", "v1_5", "gtk_v4_6"] }
libc = "0.2"

[package.metadata.deb]
depends = "libgtk-4-1 (>= 4.6), libadwaita-1-0 (>= 1.1)"
section = "utils"
copyright = "Copyright (C) 2026 the Sysmon authors"
maintainer-scripts = "debian"
assets = [
    ["target/release/sysmon", "usr/bin/sysmon", "755"],
    ["data/icons/hicolor/512x512/apps/dev.sysmon.Sysmon.png", "usr/share/icons/hicolor/512x512/apps/dev.sysmon.Sysmon.png", "644"],
    ["dev.sysmon.Sysmon.desktop", "usr/share/applications/dev.sysmon.Sysmon.desktop", "644"],
    ["data/99-sysmon-rapl.rules", "etc/udev/rules.d/99-sysmon-rapl.rules", "644"],
    ["data/dev.sysmon.Sysmon.metainfo.xml", "usr/share/metainfo/dev.sysmon.Sysmon.metainfo.xml", "644"],
    ["LICENSE", "usr/share/doc/sysmon/LICENSE", "644"],
]
